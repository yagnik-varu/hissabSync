version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hisaabsync_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hisaabsync_db
    ports:
      - '5432:5432'
    volumes:
      - hisaabsync_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hisaabsync_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hisaabsync_pgdata_dev:
